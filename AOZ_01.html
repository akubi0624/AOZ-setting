<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RX-123 ガンダム TR-S［ヘイズル・ソル</title>
  <link rel="stylesheet" href="AOZ_01.css">
</head>
<body>

  <div class="main-container">
    
    <!-- 左上タイトル領域（ボタン化） -->
    <header class="title-area">
      <button class="part-btn pos-title" data-title="RX-123 ガンダム TR-S［ヘイズル・ソル］" data-description="
      TR-1［ヘイズル］の後継機として開発が進められていたTR-Sの試作過程において製造された技術実証機。
      本機はTR-Sに要求された万能化換装システムの実用化を目的として、TR計画で開発・試験されていた複数の機体の部材を積極的に転用している。
      開発時期がTR-6［ウーンドウォート］の開発計画と重なったことから、TR-6用として試験されていた新型部材も評価試験を兼ねて本機へ組み込まれた。
      そのため、本機にはTR-1系、TR-S系、TR-6系双方の技術的特徴が混在している。
      ソルはTR-Sの完成形ではなく、後のヘイズル・フレアへ至る技術的過渡点に位置する機体である。">
        <div class="title-text-group">
          <span class="model-number">RX-123 ガンダム TR-S</span>
          <span class="model-name">［ヘイズル・ソル］</span>
        </div>
        <span class="btn-icon"></span>
      </button>
    </header>

    <!-- 中央画像＆各部位ボタン配置エリア -->
    <div class="interactive-area">
      
      <!-- ★真ん中の画像（あとから画像を挿入・差し替えする場所） -->
      <img src="SOL.png" alt="機体画像" class="mech-image">

      <!-- 各部位のボタン配置 -->
      
      <!-- BODY -->
      <button class="part-btn pos-body" data-title="BODY (胴体部)" data-description="TR計画で開発されたバーザムIIの胸部構造を採用。
      既存機の構造を活用しながら、次世代機に要求される機動性と拡張性を両立できるかを検証するために搭載された。また腕部接続部に関しては技術試験用の簡易モデルを使用している。">
        <span class="btn-text">BODY</span>
        <span class="btn-icon"></span>
      </button>

      <!-- HEAD -->
      <button class="part-btn pos-head" data-title="HEAD (頭部)" data-description="TR-6［ウーンドウォート］用に開発された頭部ユニットを先行搭載。
      各種センサーと火器管制系を統合し、機体構成の変更に伴う各部情報の差異を処理する能力を備える。
      万能化換装システムによって構成が変化する機体を一つのMSとして制御するための実証ユニットとして運用された。">
        <span class="btn-text">HEAD</span>
        <span class="btn-icon"></span>
      </button>

      <!-- ARM -->
      <button class="part-btn pos-arm" data-title="ARM (腕部)" data-description="高い兵装運用能力と信頼性を持つ既存の腕部を次世代機の試験機へ転用することで、新型換装システムとの互換性を検証している。
      ソルでは腕部そのものを新規設計するのではなく、完成度の高い既存ユニットを採用することで、機体側の新規機構と兵装運用系の評価を分離。新型換装システムが従来型MSの兵装運用能力を損なわないかを検証する役割を担った。
      特に本機で運用されるロングブレードライフル用拡張ユニットとの連携を想定し、重量の大きい追加装備を装着した際の腕部フレームへの負荷や姿勢制御への影響が検証された。">
        <span class="btn-text">ARM</span>
        <span class="btn-icon"></span>
      </button>

      <!-- WEAPON -->
      <button class="part-btn pos-weapon" data-title="試作型拡張ユニット" data-description="ソルの主兵装であるロングブレードライフルに装着する、拡張装備の試作ユニット。
      TR計画で進められていた万能化換装システムを武装にも適用し、任務内容に応じて主兵装の性能を変更することを目的として開発された。
      本装備は火力・射程の向上を主眼としており、ライフル本体の基本機能を維持したまま追加装備を装着できる。
      これにより、単一の専用武装を複数開発することなく、任務に応じて一つの主兵装を再構成することが可能となる。
      ただし試作段階では重量増加やエネルギー伝達効率、機体側の重量バランスなどに問題が残されており、実戦での運用には制約があった。
      後に本装備で得られたデータを基に、より完成度の高い強化型ロングブレードライフルの開発へと発展していく。">
        <span class="btn-text">WEPON</span>
        <span class="btn-icon"></span>
      </button>

      <!-- CROTCH -->
      <button class="part-btn pos-crotch" data-title="CROTCH (腰部)" data-description="TR計画で開発された汎用ドラムフレームを基礎とした腰部ユニット。
      上半身と下半身の接続に加え、各種増加装甲・兵装ユニットとの接続規格を集約しており、機体構成を変更した際にも各部の機能を維持できるよう設計されている。
      SOLでは、TR-Sへの採用を想定した高い拡張性を持たせる一方、開発中であったTR-6系の構造も取り入れ、異なる規格のパーツを接続するための試験が行われた。">
        <span class="btn-text">CROTCH</span>
        <span class="btn-icon"></span>
      </button>

      <!-- LEG -->
      <button class="part-btn pos-leg" data-title="LEG (脚部)" data-description="TR計画において開発された、万能化換装システムの実証を目的とする脚部ユニット。
      機体の運用目的に応じた脚部の換装を想定し、機動性・防御力・積載能力など、異なる要求に対応できる拡張性を備えている。
      ソルでは、TR-6系の脚部構造を取り入れることで、従来のTR-1系機体との互換性、および異なる規格の脚部ユニットを用いた際の機体制御や重量バランスの変化について検証が行われた。">
        <span class="btn-text">LEG</span>
        <span class="btn-icon"></span>
      </button>

    </div>

    <!-- 詳細カード modal (ボタンを押した時に表示される白い枠線の解説パネル) -->
    <div id="detail-modal" class="detail-card" aria-hidden="true">
      <div class="card-inner">
        <h2 id="modal-title" class="card-title">部位タイトル</h2>
        <p id="modal-desc" class="card-text">
          ここに詳細なテスト文が入ります。
        </p>
      </div>
    </div>

  </div>

  <script src="AOZ_01.js"></script>
</body>
</html>
